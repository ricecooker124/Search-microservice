quarkus.http.port=8084

quarkus.datasource.db-kind=mysql
quarkus.datasource.reactive.url=vertx-reactive:mysql://db:3306/journal_db
quarkus.datasource.username=searchapp_user
quarkus.datasource.password=searchpass

quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true

# OIDC/JWT Configuration
quarkus.oidc.auth-server-url=http://keycloak:8080/realms/patient-journal
quarkus.oidc.client-id=patient-journal-backend
quarkus.oidc.credentials.secret=backend-secret-key-123
quarkus.oidc.token.issuer=http://localhost:8080/realms/patient-journal

# Auth permissions
quarkus.http.auth.permission.authenticated.paths=/api/*
quarkus.http.auth.permission.authenticated.policy=authenticated

quarkus.http.auth.permission.public.paths=/health,/q/*,/openapi,/swagger-ui/*
quarkus.http.auth.permission.public.policy=permit