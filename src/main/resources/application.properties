quarkus.http.port=${PORT:8084}

quarkus.datasource.db-kind=mysql
quarkus.datasource.reactive.url=${QUARKUS_DATASOURCE_REACTIVE_URL:vertx-reactive:mysql://db:3306/journal_db}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:searchapp_user}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:searchpass}

quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true

quarkus.oidc.auth-server-url=${QUARKUS_OIDC_AUTH_SERVER_URL:http://keycloak:8080/realms/patient-journal}
quarkus.oidc.client-id=${QUARKUS_OIDC_CLIENT_ID:patient-journal-backend}
quarkus.oidc.credentials.secret=${QUARKUS_OIDC_CLIENT_SECRET:backend-secret-key-123}
quarkus.oidc.token.issuer=${QUARKUS_OIDC_TOKEN_ISSUER:${quarkus.oidc.auth-server-url}}

quarkus.http.auth.permission.authenticated.paths=/api/*
quarkus.http.auth.permission.authenticated.policy=authenticated

quarkus.http.auth.permission.public.paths=/health,/q/*,/openapi,/swagger-ui/*
quarkus.http.auth.permission.public.policy=permit
